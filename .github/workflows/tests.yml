name: Automated tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node-tests:
    name: Node tests (no browser)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Projektzentrale daneben holen (spektron-ordner.js byte-gleich prüfen)
        env:
          ZWEIG: ${{ github.head_ref }}
          BASIS: ${{ github.base_ref }}
        # gleichnamiger Zweig, sonst der Basiszweig des PRs (gestapelte PRs), sonst main
        run: git clone --quiet --depth 1 --branch "$ZWEIG" https://github.com/kaspersebastian83-dot/projektzentrale.git ../projektzentrale 2>/dev/null || git clone --quiet --depth 1 --branch "$BASIS" https://github.com/kaspersebastian83-dot/projektzentrale.git ../projektzentrale 2>/dev/null || git clone --quiet --depth 1 https://github.com/kaspersebastian83-dot/projektzentrale.git ../projektzentrale
      - run: node tests/spektron-ordner.cjs
        env:
          SPEKTRON_ORDNER_PFLICHT: '1'
      - name: Textbausteine (alle Berichtsvarianten)
        run: node tests/text.cjs
      - name: Anlagen (erkennen, Hausreihenfolge, veraltet)
        run: node tests/anlagen.cjs
      - name: Berichtsart, gemeinsame Bausteine, Word-Tabellen und Unterüberschriften
        run: node tests/berichtsart.cjs
      - name: Asbestbericht wie festgeschrieben (Beispielberichte)
        run: node tests/asbest-golden.cjs
      - name: Brandbericht – Regeln (Gerüst, 5. Befund, Einordnung, Rolle wie Projektzentrale)
        run: node tests/brand.cjs
        env:
          SPEKTRON_ORDNER_PFLICHT: '1'
      - name: Brandbericht wie festgeschrieben (Beispielberichte)
        run: node tests/brand-golden.cjs
      - name: Word-Kommentar je Lücke, Lücken-Prüfung der Projektzentrale findet dieselben Lücken
        run: node tests/luecken-kommentare.cjs
        env:
          SPEKTRON_ORDNER_PFLICHT: '1'
      - name: LabelKit daneben holen (Spektron-Leiste byte-gleich prüfen)
        env:
          ZWEIG: ${{ github.head_ref }}
          BASIS: ${{ github.base_ref }}
        # gleichnamiger Zweig, sonst der Basiszweig des PRs (gestapelte PRs), sonst main
        run: git clone --quiet --depth 1 --branch "$ZWEIG" https://github.com/kaspersebastian83-dot/labelkit.git ../labelkit 2>/dev/null || git clone --quiet --depth 1 --branch "$BASIS" https://github.com/kaspersebastian83-dot/labelkit.git ../labelkit 2>/dev/null || git clone --quiet --depth 1 https://github.com/kaspersebastian83-dot/labelkit.git ../labelkit
      - name: FotoKit daneben holen (Spektron-Leiste und Spektron-Look byte-gleich prüfen)
        env:
          ZWEIG: ${{ github.head_ref }}
          BASIS: ${{ github.base_ref }}
        # gleichnamiger Zweig, sonst der Basiszweig des PRs, sonst main
        run: git clone --quiet --depth 1 --branch "$ZWEIG" https://github.com/kaspersebastian83-dot/bildumbenenner.git ../bildumbenenner 2>/dev/null || git clone --quiet --depth 1 --branch "$BASIS" https://github.com/kaspersebastian83-dot/bildumbenenner.git ../bildumbenenner 2>/dev/null || git clone --quiet --depth 1 https://github.com/kaspersebastian83-dot/bildumbenenner.git ../bildumbenenner
      - name: Offline-Dateien und Leiste
        run: node tests/sw.cjs
      - name: Leiste v3, Spektron-Look und Berichtsart ohne art (gemerkt / Proben / asbest), Haken, Weiter
        run: node tests/leiste.cjs

  browser-tests:
    name: Browser test (chromium)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Install Playwright (pinned, not part of the repository)
        run: |
          npm install --no-save --no-package-lock --prefix "$RUNNER_TEMP/pw" playwright@1.56.1
          echo "NODE_PATH=$RUNNER_TEMP/pw/node_modules" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
      - name: Projekt öffnen, Vorschau, Einstellungen, Word-Datei in „Mitteilungen“
        run: node tests/browser.cjs
